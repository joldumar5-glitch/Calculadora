<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #2c3e50; }
        .calculator { background-color: #34495e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; }
        #display { width: 100%; height: 50px; font-size: 1.5rem; text-align: right; margin-bottom: 15px; padding: 10px; box-sizing: border-box; border: none; border-radius: 5px; background: #ecf0f1; color: #2c3e50; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; transition: background 0.2s; background: #95a5a6; color: white; }
        button:hover { background: #7f8c8d; }
        .btn-op { background: #e67e22; }
        .btn-op:hover { background: #d35400; }
        .btn-sci { background: #3498db; font-size: 0.9rem; }
        .btn-sci:hover { background: #2980b9; }
        .btn-equal { background: #27ae60; grid-column: span 2; }
        .btn-equal:hover { background: #219150; }
        .btn-clear { background: #c0392b; }
        .btn-clear:hover { background: #a93226; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button class="btn-sci" onclick="insert('Math.sin(')">sin</button>
        <button class="btn-sci" onclick="insert('Math.cos(')">cos</button>
        <button class="btn-sci" onclick="insert('Math.tan(')">tan</button>
        <button class="btn-sci" onclick="insert('Math.log10(')">log</button>
        
        <button class="btn-sci" onclick="insert('Math.PI')">π</button>
        <button class="btn-sci" onclick="insert('Math.sqrt(')">√</button>
        <button class="btn-sci" onclick="insert('**')">xʸ</button>
        <button class="btn-sci" onclick="insert('Math.exp(')">exp</button>

        <button class="btn-clear" onclick="clearDisplay()">C</button>
        <button onclick="backspace()"><</button>
        <button onclick="insert('(')">(</button>
        <button onclick="insert(')')">)</button>

        <button onclick="insert('7')">7</button>
        <button onclick="insert('8')">8</button>
        <button onclick="insert('9')">9</button>
        <button class="btn-op" onclick="insert('/')">/</button>

        <button onclick="insert('4')">4</button>
        <button onclick="insert('5')">5</button>
        <button onclick="insert('6')">6</button>
        <button class="btn-op" onclick="insert('*')">*</button>

        <button onclick="insert('1')">1</button>
        <button onclick="insert('2')">2</button>
        <button onclick="insert('3')">3</button>
        <button class="btn-op" onclick="insert('-')">-</button>

        <button onclick="insert('0')">0</button>
        <button onclick="insert('.')">.</button>
        <button class="btn-op" onclick="insert('+')">+</button>
        <button class="btn-equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function insert(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            // eval() processa a string como código JavaScript
            // Cuidado: em apps reais, use um parser de matemática por segurança
            let result = eval(display.value);
            
            if (result !== undefined) {
                display.value = Number(result.toFixed(8)); // Limita casas decimais
            }
        } catch (e) {
            display.value = "Erro";
            setTimeout(clearDisplay, 1500);
        }
    }
</script>

</body>
</html>
